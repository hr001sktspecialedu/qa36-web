<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบติดตามการส่งเอกสาร 1ม.36 / 2ม.36</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f3f4f6;
    }
    .gradient-border {
      border: 2px solid transparent;
      background: linear-gradient(white, white) padding-box, 
                  linear-gradient(to right, #9c27b0, #ffc107) border-box;
      transition: all 0.3s ease;
    }
    .gradient-border:focus {
      transform: scale(1.01);
      box-shadow: 0 0 15px rgba(156, 39, 176, 0.2);
      outline: none;
    }
    .card-hover {
      transition: all 0.2s ease-in-out;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .loader {
      border-top-color: #3498db;
      -webkit-animation: spinner 1.5s linear infinite;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">ระบบติดตามการส่งเอกสาร 1ม.36 / 2ม.36</h1>
      <p class="text-gray-500">ศูนย์การศึกษาพิเศษ ประจำจังหวัดสุโขทัย</p>
    </div>

    <!-- Stats & Progress -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-semibold text-gray-700">ภาพรวมการส่งเอกสาร</h2>
        <span id="statsText" class="text-sm font-medium text-purple-600 bg-purple-50 px-3 py-1 rounded-full">กำลังโหลด...</span>
      </div>
      
      <!-- Progress Bar 1: จำนวนเอกสารที่มีอยู่จริงในระบบ -->
      <div class="mb-4">
        <div class="flex justify-between text-xs text-gray-500 mb-1">
          <span>ความคืบหน้า (จำนวนเอกสาร)</span>
          <span id="progressTextFiles">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div id="progressBarFiles" class="bg-green-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Progress Bar 2: จำนวนบุคลากรที่ส่งครบภาระงานของตนเอง -->
      <div>
        <div class="flex justify-between text-xs text-gray-500 mb-1">
          <span>ความคืบหน้า (จำนวนบุคลากรที่ส่งครบ)</span>
          <span id="progressTextPeople">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div id="progressBarPeople" class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="mb-8 relative">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <i class="fas fa-search text-gray-400"></i>
      </div>
      <input type="text" id="searchInput" 
        class="w-full pl-11 pr-4 py-3 md:py-4 rounded-xl gradient-border text-gray-700 text-lg shadow-sm" 
        placeholder="พิมพ์ชื่อบุคลากรเพื่อค้นหา..." 
        onkeyup="filterCards()">
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="flex flex-col justify-center items-center py-20">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
      <p class="text-gray-500 font-medium">กำลังโหลดข้อมูลจากระบบ...</p>
    </div>

    <!-- Cards Container -->
    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
  </div>

  <script>
    // ==========================================
    // 1. API ดึงข้อมูล (เร็วปรื๊ด ด้วย Node.js ของ Render)
    const NODE_API_URL = "https://qa36-api.onrender.com/api/getData"; 

    // 2. API อัปโหลดไฟล์ (ไร้ขีดจำกัดโควต้า ด้วย Google Apps Script)
    const GAS_UPLOAD_URL = "https://script.google.com/macros/s/AKfycby5wShwrN5nZzshPRX9SzIs7QTbixDiPbvBokR5plWeRG9zWQlVCnMQk1-SfzIQ8upA/exec";
    // ==========================================

    let allData = [];

    window.onload = () => {
      fetchData();
    };

    // ดึงข้อมูลและประมวลผลก่อนแสดงการ์ด
    async function fetchData() {
      try {
        const response = await fetch(NODE_API_URL);
        if (!response.ok) throw new Error('Network error');
        const resultData = await response.json();
        
        // 💡 ปรับปรุง: ตรวจสอบความครบถ้วนรายบุคคลแบบ Dynamic และจัดเรียงความสำคัญใหม่บนหน้าบ้าน
        allData = resultData.map(student => {
          const hasT1 = student.term1.exists;
          const hasT2 = student.term2.exists;
          
          // ตรวจสอบว่าในแต่ละเทอมที่มีไฟล์ต้นทาง ได้รับการส่งงานครบแล้วหรือยัง
          const t1Done = !hasT1 || student.term1.submitted;
          const t2Done = !hasT2 || student.term2.submitted;
          
          // กำหนดสถานะส่งครบ: ต้องมีไฟล์อย่างน้อย 1 เทอม และทุกเทอมที่มีไฟล์ต้องส่งครบหมดแล้ว
          student.isComplete = (hasT1 || hasT2) && t1Done && t2Done;
          
          // กำหนด priority: 0 = ยังไม่ครบ (เรียงขึ้นบนสุด), 1 = ครบแล้ว (เรียงลงล่างสุด)
          student.priority = student.isComplete ? 1 : 0;
          return student;
        });

        // ทำการจัดเรียง (Sort): เอาคนที่ "ยังไม่ส่ง/ส่งไม่ครบ" ขึ้นก่อนคนส่งครบแล้ว
        allData.sort((a, b) => a.priority - b.priority);
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('cardsContainer').classList.remove('hidden');
        
        updateStats(allData);
        renderCards(allData);
      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById('loading').innerHTML = `
          <div class="text-red-500 text-center py-10 px-4 bg-red-50 rounded-xl border border-red-100 max-w-xl mx-auto">
            <i class="fas fa-exclamation-triangle text-4xl mb-3"></i>
            <h3 class="font-bold text-lg mb-1">เซิร์ฟเวอร์ยังไม่พร้อมใช้งาน</h3>
            <p class="text-sm text-red-600 mb-3">โปรดรอประมาณ 30-50 วินาทีเพื่อให้เซิร์ฟเวอร์ Render ตื่น แล้วรีเฟรชอีกครั้งครับ</p>
          </div>`;
      }
    }

    // คำนวณและแสดงแถบ Progress bar สถิติรวม
    function updateStats(data) {
      let totalExpectedFiles = 0;
      let totalSubmittedFiles = 0;
      let totalPeople = data.length;
      let completedPeople = 0;

      data.forEach(student => {
        let expected = 0;
        let submitted = 0;
        
        // นับเฉพาะไฟล์ที่ต้องส่งจริงๆ (มีไฟล์ในระบบ)
        if (student.term1.exists) {
          expected++;
          if (student.term1.submitted) submitted++;
        }
        if (student.term2.exists) {
          expected++;
          if (student.term2.submitted) submitted++;
        }
        
        totalExpectedFiles += expected;
        totalSubmittedFiles += submitted;
        
        // ถือเป็น "ส่งครบแล้ว" หากมีภาระงานที่ต้องส่ง และส่งสำเร็จครบถ้วนทุกไฟล์
        const isComplete = expected > 0 && submitted === expected;
        if (isComplete) {
          completedPeople++;
        }
      });

      // แถบสีเขียว (จำนวนไฟล์สะสม)
      const percentFiles = totalExpectedFiles === 0 ? 0 : Math.round((totalSubmittedFiles / totalExpectedFiles) * 100);
      document.getElementById('progressBarFiles').style.width = percentFiles + '%';
      document.getElementById('progressTextFiles').innerText = `${totalSubmittedFiles}/${totalExpectedFiles} เอกสาร (${percentFiles}%)`;

      // แถบสีฟ้า (จำนวนบุคลากร)
      const percentPeople = totalPeople === 0 ? 0 : Math.round((completedPeople / totalPeople) * 100);
      document.getElementById('progressBarPeople').style.width = percentPeople + '%';
      document.getElementById('progressTextPeople').innerText = `${completedPeople}/${totalPeople} คน (${percentPeople}%)`;

      document.getElementById('statsText').innerText = `ส่งครบแล้ว ${completedPeople} จาก ${totalPeople} คน`;
    }

    // สร้างการ์ดแสดงผลรายบุคคล
    function renderCards(data) {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">ไม่พบข้อมูลในระบบ</div>`;
        return;
      }

      data.forEach(student => {
        const isComplete = student.isComplete;
        const statusBadge = isComplete 
          ? `<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-medium flex items-center gap-1"><i class="fas fa-check-circle"></i>ส่งครบแล้ว</span>`
          : `<span class="bg-orange-100 text-orange-700 text-xs px-2.5 py-1 rounded-full font-medium flex items-center gap-1"><i class="fas fa-clock"></i>รอดำเนินการ</span>`;

        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl p-5 shadow-sm border ${isComplete ? 'border-green-200 bg-green-50/10' : 'border-gray-200'} card-hover`;
        card.setAttribute('data-name', student.fullName.toLowerCase());
        
        card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <h3 class="text-md font-semibold text-gray-800 leading-tight pr-2">${student.fullName}</h3>
            ${statusBadge}
          </div>
          <div class="space-y-3">
            ${generateTermHtml(student.term1, '1ม36', 'ภาคเรียนที่ 1', student.fullName)}
            ${generateTermHtml(student.term2, '2ม36', 'ภาคเรียนที่ 2', student.fullName)}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // สร้างกล่องแถบภาระงานของแต่ละภาคเรียน
    function generateTermHtml(termData, termCode, termLabel, studentName) {
      let btn = '';
      let bgClass = 'bg-gray-50 border-gray-100';

      if (!termData.exists) {
        // กรณีไม่มีไฟล์ให้ส่ง (เช่น บุคลากรท่านนี้ไม่มีไฟล์ในเทอมนั้นๆ)
        btn = `<span class="text-xs text-gray-400 bg-gray-100 px-2.5 py-1 rounded-md">- ไม่มีภาระงาน -</span>`;
      } else if (termData.submitted) {
        // กรณีอัปโหลดส่งงานสำเร็จแล้ว
        bgClass = 'bg-green-50/40 border-green-100';
        btn = `
          <div class="flex items-center gap-1 text-green-600">
            <i class="fas fa-check-circle text-sm"></i>
            <span class="text-xs font-bold">ส่งแล้ว</span>
          </div>`;
      } else {
        // กรณีมีภาระงานแต่ยังไม่ได้ส่ง
        btn = `
          <div class="flex gap-2">
            <a href="${termData.dlUrl}" target="_blank" 
               class="text-xs bg-white text-blue-600 hover:bg-blue-50 px-2.5 py-1.5 rounded-lg border border-blue-200 flex items-center gap-1 font-medium transition-colors">
              <i class="fas fa-download"></i> โหลดแบบเก็บ
            </a>
            <button onclick="uploadFile('${studentName}', '${termCode}')" 
                    class="text-xs bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 font-medium transition-colors shadow-sm">
              <i class="fas fa-upload"></i> ส่งงาน
            </button>
          </div>`;
      }

      return `
        <div class="flex justify-between items-center p-3 rounded-xl border ${bgClass} gap-3">
          <div>
            <p class="text-sm font-bold ${termData.submitted ? 'text-green-800' : 'text-gray-700'}">${termLabel}</p>
            <p class="text-[10px] text-gray-400">รหัสเอกสาร: ${termCode}</p>
          </div>
          ${btn}
        </div>`;
    }

    // ระบบค้นหารายชื่อ
    function filterCards() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('#cardsContainer > div');
      
      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        if (name.includes(input)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // ระบบอัปโหลดไฟล์ไปยัง Google Apps Script (ประหยัดโควต้าบอท)
    function uploadFile(name, term) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/pdf';
      
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // ลบช่องว่างในชื่อไฟล์ตอนส่งขึ้นระบบ
        const cleanName = name.replace(/\s+/g, "");
        const fileName = `${term}${cleanName}.pdf`;

        // สร้างจอ Overlay แสดงสถานะกำลังโหลด
        const loadingOverlay = document.createElement('div');
        loadingOverlay.className = "fixed inset-0 bg-black bg-opacity-50 flex flex-col justify-center items-center z-50 text-white";
        loadingOverlay.innerHTML = `
          <div class="loader ease-linear rounded-full border-4 border-t-4 border-white h-16 w-16 mb-4"></div>
          <h2 class="text-xl font-bold">กำลังอัปโหลดเอกสาร...</h2>
          <p class="text-sm mt-2">กรุณารอสักครู่ ห้ามปิดหน้าต่างนี้ (ใช้เวลาประมาณ 5-10 วินาที)</p>
        `;
        document.body.appendChild(loadingOverlay);

        const reader = new FileReader();
        reader.onload = async function(event) {
          const base64Data = event.target.result;
          
          try {
            const response = await fetch(GAS_UPLOAD_URL, {
              method: 'POST',
              body: JSON.stringify({ 
                base64: base64Data, 
                fileName: fileName 
              })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
              alert(result.message);
              location.reload(); // รีเฟรชหน้าเพื่อดึงค่าสถานะล่าสุดทันที
            } else {
              throw new Error(result.message);
            }
          } catch (error) {
            console.error("Upload error:", error);
            alert('❌ เกิดข้อผิดพลาดในการอัปโหลด: ' + error.message);
          } finally {
            if(document.body.contains(loadingOverlay)){
               document.body.removeChild(loadingOverlay);
            }
          }
        };
        
        reader.readAsDataURL(file);
      };
      
      input.click();
    }
  </script>
</body>
</html>
